server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Behind Traefik, which terminates TLS. Do not redirect to https here:
    # Traefik already did, and a second redirect inside the container is how
    # you get a loop.

    # index.html must NEVER be cached. The bundle filenames are hashed, so a
    # stale index.html is the one file that can pin a browser to a deleted
    # bundle and show a white page after every deploy.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    # Hashed assets are immutable by construction: a change produces a new
    # filename, so a year is safe and saves a revalidation on every load.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Monaco's workers and the wasm files are fetched by path, not imported,
    # so they must resolve or the editor silently fails to start.
    location ~* \.(wasm|worker\.js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # THE SPA RULE. React Router owns /projects/1/workbench/testcases; nginx
    # has no such file and would 404. Hand anything unmatched to index.html
    # and let the app route it. Without this, every deep link and every
    # browser refresh away from "/" breaks — including the Keycloak redirect
    # back from login, which lands on a path the server has never heard of.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The bundle is ~500 kB gzipped and the wasm files are larger; the default
    # 1m body limit is about uploads, but keep responses unbuffered-friendly.
    client_max_body_size 32m;

    # Do not advertise the exact nginx version to the internet.
    server_tokens off;
}
