      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      - mongodb
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/srckube-module?authSource=admin
      # WP-114 — requireProjectScope() resolves membership against userService.
