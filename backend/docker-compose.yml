      userService: userservice:3000
      PROJECT_SCOPE_CACHE_TTL_MS: ${PROJECT_SCOPE_CACHE_TTL_MS}
      KeyCloak_URI: http://localhost:8080
      KeyCloak_Realm: srckube
      KeyCloak_Secret: ${KEYCLOAK_SECRET}
      # WP-101 — express-session signing key. Was hardcoded 'mySecret' in every
      # server.js (and 'test' in service-core/keycloak.js). Unset in production the
      # service now refuses to start rather than fall back to a shared constant.
      SESSION_SECRET: ${SESSION_SECRET}
      KeyCloak_publicKey:                       
      KeyCloak_clientId: node-microservice
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX}
    ports:
      - "3002:3000"
    networks:
        - src-kube-network   
  #Object Repo service
  objectrepo:
    build:
      context: .  # backend/ root, so the Dockerfile can reach shared/service-core (Sprint 1.1)
      dockerfile: objectRepo/dockerfile
    container_name: objectrepo
    healthcheck:  # WP-061 -- hits the service's own /healthz (unauthenticated,
      # genuinely pings Mongo/Redis, not just "process is up" -- see
      # service-core/health.js and EXECUTION_LOG.md's WP-061 entry).
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      - mongodb
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/srckube-objectrepo?authSource=admin
      # WP-117/118 — requireProjectScope() resolves membership against userService.
      # Without this every scoped request fails CLOSED with 503 (the WP-111 lesson).
      userService: userservice:3000
      PROJECT_SCOPE_CACHE_TTL_MS: ${PROJECT_SCOPE_CACHE_TTL_MS}
      KeyCloak_URI: http://localhost:8080
      KeyCloak_Realm: srckube
      KeyCloak_Secret: ${KEYCLOAK_SECRET}
      # WP-101 — express-session signing key. Was hardcoded 'mySecret' in every
      # server.js (and 'test' in service-core/keycloak.js). Unset in production the
      # service now refuses to start rather than fall back to a shared constant.
      SESSION_SECRET: ${SESSION_SECRET}
      KeyCloak_publicKey:                       
      KeyCloak_clientId: node-microservice
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX}
    ports:
      - "3012:3000"
    networks:
        - src-kube-network   
  #Test Planning & Execution service (Sprint 1.2 consolidation pilot — strangler-fig:
  #stood up alongside testplanservice/testexecutionservice below, not yet cut over in Kong)
  testplanexecutionservice:
    build:
      context: .  # backend/ root, so the Dockerfile can reach shared/service-core (Sprint 1.1)
      dockerfile: testPlanExecutionService/dockerfile
    container_name: testplanexecutionservice
    healthcheck:  # WP-061 -- hits the service's own /healthz (unauthenticated,
      # genuinely pings Mongo/Redis, not just "process is up" -- see
      # service-core/health.js and EXECUTION_LOG.md's WP-061 entry).
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      - mongodb
      - redis
    environment:
      MONGO_URI_TESTPLAN: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/srckube-testplan?authSource=admin
      MONGO_URI_TESTEXECUTION: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/srckube-testexecution?authSource=admin
      KeyCloak_URI: http://localhost:8080
      KeyCloak_Realm: srckube
      KeyCloak_Secret: ${KEYCLOAK_SECRET}
      # WP-101 — express-session signing key. Was hardcoded 'mySecret' in every
      # server.js (and 'test' in service-core/keycloak.js). Unset in production the
      # service now refuses to start rather than fall back to a shared constant.
      SESSION_SECRET: ${SESSION_SECRET}
      KeyCloak_publicKey: 
      KeyCloak_clientId: node-microservice
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX}
      testRepoService: testreposervice:3000
      # WP-024: see the matching comment in testreposervice's block above.
      # WP-021b: this service's TestPlan/TestExecution audit events now DO
      # have a verified projectId to stamp -- the note this comment used to
      # carry ("not yet on requireProjectScope(), a pre-existing WP-021
      # deferral") is stale; see controllers/testplan.js's updated comment.
      AUDIT_MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/srckube-comments?authSource=admin
      # WP-030: see the matching comment in testreposervice's block above.
      REDIS_URI: ${REDIS_URI}
      # WP-033: the new POST /api/v1/testexecution/ingest route uses
      # requireAuth('results:write') (@srckube/service-core), which needs
      # this env var to reach userService's live API-key verify endpoint
      # (middleware/apiKeyAuth.js) -- same reach-by-container-name
      # convention as every other cross-service env var in this file. Also
      # required by requireProjectScope() (mounted on that same route,
      # short-circuited for API-key callers but exercised for real when this
      # route is called with a human Keycloak bearer instead).
      userService: userservice:3000
      # WP-021b: this service is now on requireProjectScope() across every
      # route (both /testplan and /testexecution, not just /ingest) --
      # missing this env var before meant projectScope.js's in-process
      # project-list cache fell back to its 30s production default inside
      # this container specifically (every OTHER requireProjectScope()
      # service already sets it below), which made a just-revoked
      # membership appear to still be valid for up to 30s here. Matches the
      # same var on every other scoped service in this file.
      PROJECT_SCOPE_CACHE_TTL_MS: ${PROJECT_SCOPE_CACHE_TTL_MS}
    ports:
      - "3017:3000"
    networks:
        - src-kube-network
  #upload service
  uploadservice:
    build:
      context: .  # backend/ root, so the Dockerfile can reach shared/service-core (Sprint 1.1)
      dockerfile: uploadService/dockerfile
    container_name: uploadservice
    healthcheck:  # WP-061 -- hits the service's own /healthz (unauthenticated,
      # genuinely pings Mongo/Redis, not just "process is up" -- see
      # service-core/health.js and EXECUTION_LOG.md's WP-061 entry).
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      - mongodb
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/srckube-attachments?authSource=admin
      # WP-112 — requireProjectScope() resolves membership against userService
      # (WP-110 architecture (c)). Without this every scoped request fails CLOSED
      # with 503 "identity service unavailable" — the WP-111 lesson, recorded in
      # EXECUTION_LOG.md as a checklist item for exactly this reason.
      userService: userservice:3000
      PROJECT_SCOPE_CACHE_TTL_MS: ${PROJECT_SCOPE_CACHE_TTL_MS}
      KeyCloak_URI: http://localhost:8080
      KeyCloak_Realm: srckube
      KeyCloak_Secret: ${KEYCLOAK_SECRET}
      # WP-101 — express-session signing key. Was hardcoded 'mySecret' in every
      # server.js (and 'test' in service-core/keycloak.js). Unset in production the
      # service now refuses to start rather than fall back to a shared constant.
      SESSION_SECRET: ${SESSION_SECRET}
      KeyCloak_publicKey:                       
      KeyCloak_clientId: node-microservice
      # WP-135 — abuse and cost controls on upload. Every one is a cap with a
      # conservative default in utils/upload.js, so the OWNER'S numbers are a
      # config change here rather than a code change. A malformed value falls
      # back to the default rather than removing the cap.
      UPLOAD_MAX_FILE_BYTES: ${UPLOAD_MAX_FILE_BYTES:-26214400}
      UPLOAD_MAX_PROJECT_BYTES: ${UPLOAD_MAX_PROJECT_BYTES:-2147483648}
      UPLOAD_MAX_FILES_PER_REQUEST: ${UPLOAD_MAX_FILES_PER_REQUEST:-10}
      UPLOAD_ALLOWED_MIME_TYPES: ${UPLOAD_ALLOWED_MIME_TYPES:-}
      UPLOAD_ALLOWED_EXTENSIONS: ${UPLOAD_ALLOWED_EXTENSIONS:-}
    ports:
      - "3009:3000" 
    networks:
        - src-kube-network      
  #user service
  userservice:
    build:
      context: .  # backend/ root, so the Dockerfile can reach shared/service-core (Sprint 1.1)
      dockerfile: userService/dockerfile
    container_name: userservice
    healthcheck:  # WP-061 -- hits the service's own /healthz (unauthenticated,
      # genuinely pings Mongo/Redis, not just "process is up" -- see
      # service-core/health.js and EXECUTION_LOG.md's WP-061 entry).
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      - mongodb
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/srckube-user?authSource=admin
      # WP-119 — audit() writes to the shared AuditEvent store, which lives in
      # srckube-comments (one collection for every service's events, so the
      # audit read API can answer across them). Without this var audit() LOGS A
      # WARNING AND DROPS THE EVENT — it never fails the business operation, so a
      # missing URI is silent. This service audits from WP-119 onward, so it needs it.
      AUDIT_MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/srckube-comments?authSource=admin
      # WP-132 — invitation mail. Same SMTP credentials WP-130 configured for
      # Keycloak, read by service-core/mailer.js. Only userservice sends mail
      # today, so only userservice receives these.
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-vedan}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      # Public base URL the invite LINK points at (the frontend, not this API).
      # Never derived from request headers: those are attacker-controlled on a
      # public endpoint and would turn an invite mail into an open redirect.
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      # WP-116 follow-up — createProject seeds the new project's default defect
      # workflow via istatusservice's idempotent POST /api/v1/issuestatus/seed.
      # Container name, never localhost (the WP-012b regression class). Best
      # effort: if this is unset or unreachable the project is still created and
      # the response reports statusWorkflowSeeded: false.
      istatusService: istatusservice:3000
      # WP-012b: KeyCloak_URI is issuer-validation only (string-matched
      # against incoming tokens' `iss` claim, which is minted as
      # http://localhost:8080 by this stack) — it must match the other 13
      # services, NOT the Docker-network hostname. Outbound admin/token API
      # calls from inside this container use KeyCloak_Admin_URI instead (see
      # backend/userService/controllers/users.js). Splitting these was the
      # WP-012b fix for the issuer-mismatch 403 the WP-012 migration caused
      # by collapsing both uses onto this one var.
      KeyCloak_URI: http://localhost:8080
      KeyCloak_Admin_URI: http://keycloak:8080
      KeyCloak_Realm: srckube
      KeyCloak_Secret: ${KEYCLOAK_SECRET}
      # WP-101 — express-session signing key. Was hardcoded 'mySecret' in every
      # server.js (and 'test' in service-core/keycloak.js). Unset in production the
      # service now refuses to start rather than fall back to a shared constant.
      SESSION_SECRET: ${SESSION_SECRET}
      KeyCloak_publicKey: 
      KeyCloak_clientId: node-microservice
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX}
      Redis_URI: redis
      # WP-022 (TD-03): the legacy JWT register/login path this JWT_SECRET/
      # JWT_EXPIRE/JWT_COOKIE_EXPIRE config wired up (WP-012b) is retired --
      # routes/auth.js, controllers/auth.js, middleware/auth.js are removed
      # from the image, so these vars have no remaining consumer. See
      # EXECUTION_LOG.md's WP-022 entry for the consumer-audit evidence.
      # WP-032: self-referential -- only the two /api/v1/apikeys/demo/*
      # matrix-test routes use @srckube/service-core's cross-service
      # requireProjectScope() (to prove that real, other-service pattern
      # end-to-end); every real userService route keeps using the local,
      # no-self-HTTP-call middleware/apiKeyProjectScope.js instead. See
      # EXECUTION_LOG.md's WP-032 entry.
      userService: userservice:3000
