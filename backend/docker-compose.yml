      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      - mongodb
      - redis
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/srckube-requirements?authSource=admin
      # WP-104 -- cap on how many documents GET /wildcardsearch may return.
      # Defaults to 100 in code (shared/service-core/utils/searchQuery.js) if unset.
      WILDCARD_SEARCH_MAX_RESULTS: ${WILDCARD_SEARCH_MAX_RESULTS:-100}
      KeyCloak_URI: http://localhost:8080
      KeyCloak_Realm: srckube
      KeyCloak_Secret: ${KEYCLOAK_SECRET}
      # WP-101 — express-session signing key. Was hardcoded 'mySecret' in every
      # server.js (and 'test' in service-core/keycloak.js). Unset in production the
      # service now refuses to start rather than fall back to a shared constant.
      SESSION_SECRET: ${SESSION_SECRET}
      KeyCloak_publicKey:                       
      KeyCloak_clientId: node-microservice
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX}
      # WP-021: requireProjectScope() -> userService (the identity service).
      userService: userservice:3000
      PROJECT_SCOPE_CACHE_TTL_MS: ${PROJECT_SCOPE_CACHE_TTL_MS}
      # WP-024: see the matching comment in testreposervice's block above.
      AUDIT_MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/srckube-comments?authSource=admin
      # WP-030: see the matching comment in testreposervice's block above.
      REDIS_URI: ${REDIS_URI}
    ports:
      - "3005:3000"
    networks:
        - src-kube-network
  #folder service    
  folderservice:
    build:
      context: .  # backend/ root, so the Dockerfile can reach shared/service-core (Sprint 1.1)
      dockerfile: folderService/dockerfile
    container_name: folderservice
    healthcheck:  # WP-061 -- hits the service's own /healthz (unauthenticated,
