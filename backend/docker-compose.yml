      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      - mongodb
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/srckube-fields?authSource=admin
      KeyCloak_URI: http://localhost:8080
      KeyCloak_Realm: srckube
      KeyCloak_Secret: ${KEYCLOAK_SECRET}
      # WP-101 — express-session signing key. Was hardcoded 'mySecret' in every
      # server.js (and 'test' in service-core/keycloak.js). Unset in production the
      # service now refuses to start rather than fall back to a shared constant.
      SESSION_SECRET: ${SESSION_SECRET}
      KeyCloak_publicKey:                       
      KeyCloak_clientId: node-microservice
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX}
      # WP-043: fieldsService's new SavedView routes (routes/savedView.js)
      # are the first routes in this service to call requireProjectScope()
      # -- the pre-existing `fields` routes never adopted WP-021. Without
      # this var, requireProjectScope() -> userService fails closed (503
      # "identity service unavailable"), reproduced live before adding
      # this line; see EXECUTION_LOG.md's WP-043 report. Same var name/value
      # every other WP-021-migrated service in this file already sets.
      userService: userservice:3000
      # Wave A-1: fieldsservice was missing this var, unlike every other
      # WP-021-scoped service in this file -- found while verifying the
      # `/field` route fix (a revoked-membership test kept observing stale
      # cached membership past the .env.test PROJECT_SCOPE_CACHE_TTL_MS=2000
      # window because this container was silently falling back to
      # projectScope.js's 30s default). Added for parity/test-reliability;
      # does not change fix behavior, only cache freshness.
      PROJECT_SCOPE_CACHE_TTL_MS: ${PROJECT_SCOPE_CACHE_TTL_MS}
    ports:
      - "3004:3000"
    networks:
        - src-kube-network

  #Module service
  moduleservice:
    build:
      context: .  # backend/ root, so the Dockerfile can reach shared/service-core (Sprint 1.1)
      dockerfile: moduleService/dockerfile
    container_name: moduleservice
    healthcheck:  # WP-061 -- hits the service's own /healthz (unauthenticated,
