version: '3.8'

services:
  # MongoDB Service
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-srckube-data:/data/db   # Persistent volume for MongoDB data
    environment:
      # WP-101 — the Mongo root credentials come from backend/.env (gitignored)
      # instead of being written here. This file is TRACKED, so every one of the
      # 27 occurrences of this password was a committed secret, and rotating it
      # (WP-100) meant editing 36 places across 10 tracked files.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    networks:
        - src-kube-network  
  redis:
    image: redis:alpine  # Use the official Redis image from Docker Hub
    container_name: redis  # Optional: Set a container name
    ports:
      # WP-030: mapped to a NON-default host port, deliberately. A stray
      # native Homebrew redis-server (unrelated to this project) was found
      # listening on the host's 127.0.0.1:6379 -- the exact same
      # shadowing hazard already documented for MongoDB/MCP (see this
      # session's environment hazards), just for Redis: any host process
      # (e.g. a Jest suite run via `npm test`, per GR-6) connecting to
      # "localhost:6379" silently talks to that unrelated stray instance
      # (confirmed by INFO server: redis_version 7.0.8 / pid 2082, vs. this
      # container's 8.10.1 / pid 1 -- and an XLEN of 0 on the host port
      # while the container-side stream had real data). Container-to-
      # container traffic (reach-by-name `redis:6379`, e.g. userService's
      # Redis_URI, every producer's REDIS_URI in this file) is on the
      # internal Docker network and is UNAFFECTED by this host port
      # remap -- only host-side tooling needs to know about the new port.
      - "16379:6379"
    volumes:
      - redis-data:/data  # Use a named volume for persistent storage
    networks:
        - src-kube-network
  # testRepoService
  testreposervice:
    build:
      context: .  # backend/ root, so the Dockerfile can reach shared/service-core (Sprint 1.1)
      dockerfile: testRepoService/dockerfile
    container_name: testreposervice
    healthcheck:  # WP-061 -- hits the service's own /healthz (unauthenticated,
      # genuinely pings Mongo/Redis, not just "process is up" -- see
      # service-core/health.js and EXECUTION_LOG.md's WP-061 entry).
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      - mongodb
      - redis
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/srckube-testrepo?authSource=admin
      # WP-104 -- cap on how many documents GET /wildcardsearch may return.
      # Defaults to 100 in code (shared/service-core/utils/searchQuery.js) if unset.
      WILDCARD_SEARCH_MAX_RESULTS: ${WILDCARD_SEARCH_MAX_RESULTS:-100}
      KeyCloak_URI: http://localhost:8080
      KeyCloak_Realm: srckube
      KeyCloak_Secret: ${KEYCLOAK_SECRET}
      # WP-101 — express-session signing key. Was hardcoded 'mySecret' in every
      # server.js (and 'test' in service-core/keycloak.js). Unset in production the
      # service now refuses to start rather than fall back to a shared constant.
      SESSION_SECRET: ${SESSION_SECRET}
      KeyCloak_publicKey: 
      KeyCloak_clientId: node-microservice
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX}
      # WP-021: requireProjectScope() -> userService (the identity service),
      # same env-var-names-the-target-service convention as istatusService
      # (defectservice block below).
      userService: userservice:3000
      PROJECT_SCOPE_CACHE_TTL_MS: ${PROJECT_SCOPE_CACHE_TTL_MS}
      # WP-024: audit()'s dedicated Mongo connection (backend/shared/
      # service-core/audit.js). Same value as commentsservice's own
      # MONGO_URI below -- the AuditEvent collection is homed in
      # commentsService's existing srckube-comments database (see audit.js's
      # header comment for the full reasoning), not a new database/service.
      AUDIT_MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/srckube-comments?authSource=admin
      # WP-030: publishEvent()'s Redis Streams connection (backend/shared/
      # service-core/events.js) -- reach by container name like every other
      # cross-service/broker dependency in this file, never `localhost`
      # (see WP-012b's issuer-mismatch regression for why). Distinct from
      # userService's separate `Redis_URI` var (its existence-cache, a
      # different pre-existing use of the same Redis instance).
      REDIS_URI: ${REDIS_URI}
    ports:
      - "3006:3000"
    networks:
      - src-kube-network
# requirement service
  requirementservice:
    build:
      context: .  # backend/ root, so the Dockerfile can reach shared/service-core (Sprint 1.1)
      dockerfile: requirementService/dockerfile
    container_name: requirementservice
    healthcheck:  # WP-061 -- hits the service's own /healthz (unauthenticated,
