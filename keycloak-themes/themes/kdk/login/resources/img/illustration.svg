<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" role="img" aria-label="A test run: checks passing, one failing, linked to a defect">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <!-- test-run sheet -->
  <rect x="40" y="34" width="252" height="240" rx="12" fill="url(#card)" stroke="#B4CAD6" stroke-opacity="0.45"/>
  <rect x="64" y="60" width="120" height="10" rx="5" fill="#B4CAD6" fill-opacity="0.85"/>
  <rect x="64" y="80" width="72" height="8" rx="4" fill="#B4CAD6" fill-opacity="0.45"/>

  <!-- passing steps -->
  <g>
    <circle cx="76" cy="122" r="11" fill="#2e7d32"/>
    <path d="M71 122l4 4 7-8" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="98" y="116" width="150" height="10" rx="5" fill="#ffffff" fill-opacity="0.55"/>
  </g>
  <g>
    <circle cx="76" cy="160" r="11" fill="#2e7d32"/>
    <path d="M71 160l4 4 7-8" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="98" y="154" width="124" height="10" rx="5" fill="#ffffff" fill-opacity="0.55"/>
  </g>

  <!-- the failing step -->
  <g>
    <circle cx="76" cy="198" r="11" fill="#c62828"/>
    <path d="M72 194l8 8M80 194l-8 8" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="98" y="192" width="138" height="10" rx="5" fill="#ffffff" fill-opacity="0.75"/>
  </g>

  <!-- pending step -->
  <g>
    <circle cx="76" cy="236" r="11" fill="none" stroke="#9aa3ac" stroke-width="2"/>
    <rect x="98" y="230" width="96" height="10" rx="5" fill="#ffffff" fill-opacity="0.28"/>
  </g>

  <!-- traceability: failing step links to a defect -->
  <path d="M242 197 C 300 197, 300 118, 344 118" fill="none" stroke="#B4CAD6" stroke-opacity="0.75" stroke-width="2" stroke-dasharray="5 5"/>
  <g transform="translate(318,86)">
    <rect x="0" y="0" width="64" height="64" rx="14" fill="#c62828" fill-opacity="0.16" stroke="#c62828" stroke-opacity="0.55"/>
    <g transform="translate(18,18)" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" fill="none">
      <ellipse cx="14" cy="15" rx="9" ry="10" fill="#ffffff" fill-opacity="0.9" stroke="none"/>
      <path d="M14 5v-3M8 8L5 5M20 8l3-3M4 15H0M28 15h-4M6 23l-3 3M22 23l3 3M14 25v3"/>
    </g>
  </g>
</svg>
