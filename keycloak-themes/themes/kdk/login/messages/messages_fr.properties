termsText=<p><strong>Ceci est un brouillon.</strong> vedan est en b\u00eata ferm\u00e9e et ces conditions ne sont pas d\u00e9finitives. Les \u00e9l\u00e9ments marqu\u00e9s [A COMPLETER] restent \u00e0 pr\u00e9ciser. Si un point vous importe, demandez avant d'accepter.</p>\
<p><strong>De quoi s'agit-il.</strong> Une b\u00eata gratuite et ouverte \u00e0 tous d'un outil de gestion de tests, exploit\u00e9 par [A COMPLETER : nom de l'exploitant], une personne physique. Ce n'est pas un service commercial et votre participation n'est pas factur\u00e9e.</p>\
<p><strong>C'est inachev\u00e9.</strong> Attendez-vous \u00e0 des anomalies, des interruptions et des fonctionnalit\u00e9s qui changent ou disparaissent. <strong>Des donn\u00e9es peuvent \u00eatre perdues.</strong> Conservez votre propre copie de ce qui compte : l'export est disponible \u00e0 tout moment.</p>\
<p><strong>Merci de ne pas d\u00e9poser</strong> d'informations confidentielles, de donn\u00e9es personnelles concernant autrui, de pi\u00e8ces d'identit\u00e9, de donn\u00e9es de sant\u00e9, de num\u00e9ros de carte bancaire, ni rien qui rel\u00e8ve d'une r\u00e9glementation. Les pi\u00e8ces jointes servent aux preuves de test : captures, journaux, exports.</p>\
<p><strong>Vos contenus restent ici.</strong> Ils servent uniquement \u00e0 faire fonctionner le service et \u00e0 le sauvegarder. Ils ne sont jamais vendus, jamais utilis\u00e9s pour entra\u00eener un mod\u00e8le, et non partag\u00e9s avec des tiers, \u00e0 une exception pr\u00e8s : les courriels transactionnels passent par un prestataire d'envoi. <strong>Les fonctions d'IA sont d\u00e9sactiv\u00e9es pendant toute la b\u00eata</strong>, au niveau du d\u00e9ploiement et non par un r\u00e9glage modifiable, donc rien de ce que vous \u00e9crivez n'est envoy\u00e9 \u00e0 un mod\u00e8le externe. Si cela change, vous en serez inform\u00e9 au pr\u00e9alable.</p>\
<p><strong>Vos retours</strong> sur le produit peuvent \u00eatre utilis\u00e9s librement pour l'am\u00e9liorer. Cela vise vos commentaires et suggestions, jamais vos contenus.</p>\
<p><strong>Chacun peut arr\u00eater.</strong> Sur demande, votre compte et vos contenus seront supprim\u00e9s. La participation peut aussi prendre fin, avec un pr\u00e9avis raisonnable et la possibilit\u00e9 d'exporter. \u00c0 la fin de la b\u00eata, les contenus sont conserv\u00e9s [A COMPLETER : dur\u00e9e de conservation] puis supprim\u00e9s.</p>\
<p><strong>Aucune garantie.</strong> vedan est fourni en l'\u00e9tat, sans engagement de disponibilit\u00e9 ni de support, et sans garantie de d\u00e9tecter une anomalie dans vos logiciels. Vous restez responsable de vos propres tests. Rien ici n'exclut une responsabilit\u00e9 qui ne peut l\u00e9galement l'\u00eatre. Droit applicable : [A COMPLETER : juridiction].</p>\
<p><strong>Questions :</strong> [A COMPLETER : adresse de contact]. Demander avant de d\u00e9poser quelque chose est toujours bienvenu.</p>
