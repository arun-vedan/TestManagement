# WP-155 -- the terms the TERMS_AND_CONDITIONS required action shows.
#
# Rendered by terms.ftl via kcSanitize(msg("termsText")), so it is HTML and
# is sanitised before display. Keycloak's base default is literally
# "<p>Terms and conditions to be defined</p>", which every account created
# since WP-130 has been asked to accept.
#
# STILL A DRAFT. Four facts are missing and only the owner has them: the
# operator's legal name, the governing jurisdiction, a contact address, and
# the retention period. They are marked [TO BE COMPLETED] below. The draft
# notice in the first paragraph MUST stay until they are filled -- a user who
# accepts terms that are not finished has agreed to nothing, and removing the
# notice while the gaps remain would hide that rather than fix it.
#
# Deliberately short: this renders in a scrollable box above an Accept button,
# and terms nobody reads protect nobody. The fuller version, and the reasoning
# behind each clause, is in the Beta Participation Agreement drafted for the
# owner's review.
termsText=<p><strong>This is a draft.</strong> vedan is in closed beta and these terms are not final. Items marked [TO BE COMPLETED] are still being settled. If anything here matters to you, ask before you accept.</p>\
<p><strong>What this is.</strong> A free, open beta of a test-management tool that anyone may sign up for, operated by [TO BE COMPLETED: operator name], an individual. It is not a commercial service and there is nothing to pay, now or later, for your part in the beta.</p>\
<p><strong>It is unfinished.</strong> Expect defects, downtime and features that change or disappear. <strong>Data may be lost.</strong> Keep your own copy of anything that matters -- you can export your projects from the app at any time.</p>\
<p><strong>Please do not upload</strong> anything confidential, personal data about other people, identity documents, health data, payment card details, or anything subject to a regulatory regime. This is a test-management tool and attachments are meant for test evidence: screenshots, logs, exports. Keeping sensitive data out protects you and us far better than any disclaimer.</p>\
<p><strong>Your content stays here.</strong> It is used only to run the service for you and to back it up. It is never sold, never used to train any machine-learning model, and not shared with third parties -- with one exception: transactional email (verification, password resets, invitations) goes through an email provider. <strong>AI features are switched off for the whole beta</strong>, enforced for the deployment rather than by a setting anyone can toggle, so nothing you write is sent to an outside model. If that changes you will be told first, and asked.</p>\
<p><strong>Feedback</strong> you send about the product may be used freely to improve it. That covers your comments and suggestions, never your content.</p>\
<p><strong>Either of us can stop.</strong> Ask and your account and content will be deleted. Participation may also be ended, with reasonable notice and a chance to export. When the beta ends, content is kept for [TO BE COMPLETED: retention period] and then deleted.</p>\
<p><strong>No warranty.</strong> vedan is provided as is, with no uptime or support commitment and no guarantee it will find any defect in your software. You remain responsible for your own testing. Nothing here excludes liability that cannot lawfully be excluded. Governed by the laws of [TO BE COMPLETED: jurisdiction].</p>\
<p><strong>Questions:</strong> [TO BE COMPLETED: contact email]. Asking before you upload something is always fine.</p>
