      enabled: true
      config:
        claims_to_verify:
        - exp
  # ==========================================================================
  # WP-032 Kong-layer answer — how an API-key request (no Keycloak bearer at
  # all, just `X-Api-Key: <keyId>.<secret>`) reaches the service without
  # weakening WP-023's backstop everywhere else.
  #
  # The stock jwt plugin has no notion of "or accept this other credential
  # instead" -- it can only verify-or-reject a JWT. Kong OSS's supported
  # escape hatch is `config.anonymous`: on auth failure (missing OR invalid
  # JWT), instead of rejecting, the request is waved through tagged as the
  # named anonymous consumer, and it becomes the upstream SERVICE's job to
  # decide whether to accept it. That is exactly what
  # @srckube/service-core's requireAuth() (middleware/apiKeyAuth.js) does:
  # no X-Api-Key header -> falls back to keycloak.protect(), which still
  # fully verifies the JWT itself and rejects a missing/invalid/expired one
  # with its own 401/403 -- Kong waving it through anonymously does not
  # bypass that, it just moves WHERE the rejection happens, from Kong to the
  # service, for this one route only.
  #
  # This is a real, explicit tradeoff, applied ONLY to this one path prefix
  # (Kong's router matches the more specific /api/v1/apikeys/demo prefix
  # over the less-specific strict-jwt /api/v1/apikeys route above for
  # anything under it -- verified empirically, see EXECUTION_LOG.md's WP-032
  # entry): a request with a bad/expired JWT to THIS route is no longer
  # rejected AT Kong (losing the "X-Kong-Upstream-Latency absent" proof
  # WP-023 established), because it still needs to be waved through
  # anonymously to give a valid API-key-bearing request anywhere to land.
  # Every other route in this file (users/kcUser, organizations, projects,
  # apiKeysRoute above, and all 15 other services) is completely untouched
  # -- this pattern is opt-in per-route, not a global change to the jwt
  # plugin's behavior.
