  # container-to-container-only /verify sub-path -- an external caller
  # reaching /verify through Kong still needs a valid JWT here as a harmless
  # extra backstop; the endpoint's real callers (other services'
  # requireAuth() middleware) always call it directly by container hostname
  # (http://userservice:3000/...), bypassing Kong entirely, so this
  # requirement never applies to them.
