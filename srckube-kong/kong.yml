# WP-023 follow-up: preserve x-correlation-id propagation on Kong-level
# rejections. Every service already echoes a caller-supplied x-correlation-id
# back on its own responses, including ones it rejects (see
# linkIssueService/__tests__/api.test.js "correlation ID propagation"). Once
# the jwt plugin above starts rejecting unauthenticated requests AT KONG, the
# service's own echo-back code never runs for those requests, breaking that
# behavior. This global pre-function plugin restores it at the Kong layer:
# it stages the response header in the `access` phase (pre-function's default
# priority runs before the route-scoped jwt plugin), so the header is present
# on Kong's own 401 as well as on anything actually proxied to upstream.
# ROLLBACK: delete this `plugins:` block (or set enabled: false) and
# `docker restart kong`.
plugins:
- name: pre-function
  enabled: true
  config:
    access:
    - |
      local cid = kong.request.get_header("x-correlation-id")
      if cid then
        kong.response.set_header("x-correlation-id", cid)
      end

# ============================================================================
# WP-063 — CORS preflight (found by the first real-browser test in this repo)
# ============================================================================
# Every browser call this app makes carries an `Authorization` header, which is
# not CORS-safelisted, so the browser sends an `OPTIONS` preflight first. In dev
# the app is served from http://localhost:3000 but calls Kong at
# http://localhost:8000 — cross-origin, so that preflight always applies.
#
# Without this plugin the route-scoped `jwt` plugin ran on the preflight itself
# and rejected it 401 with no `Access-Control-*` headers, so the browser never
# sent the real request: every /api/v1/* call failed as net::ERR_FAILED. The
# upstream services already handle CORS correctly
# (backend/shared/service-core/security.js sets `cors()` and `app.options('*')`),
# but Kong's 401 meant the request never reached them.
#
# This was invisible to every earlier work package because jsdom (craco test)
# and Node-side axios (getServiceToken.js) do not enforce CORS at all — only a
# real browser does. Production never hit it either: .env.production points the
# app at https://srckube.com, which is same-origin (no preflight).
#
# Kong's `cors` plugin has priority 2000 vs the `jwt` plugin's 1450, so it runs
# FIRST and answers the preflight itself; `preflight_continue: false` means the
# OPTIONS never reaches the jwt plugin. Authentication on real (non-OPTIONS)
# requests is entirely unchanged — jwt still runs on those.
# ROLLBACK: delete this `- name: cors` entry (or set `enabled: false`) and
# `docker restart kong`.
- name: cors
  enabled: true
  config:
    origins:
    # WP-150 — the deployed origin must be listed or every /api/v1/*
    # call fails CORS preflight from the browser. localhost stays so a
    # developer running `npm start` against this gateway still works.
    - http://localhost:3000
    - https://app.vedan.io
    methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - HEAD
    - OPTIONS
    headers:
    - Accept
    - Content-Type
    - Authorization
    - X-Project-Id
    - X-Correlation-Id
    exposed_headers:
    - X-Correlation-Id
    credentials: true
    max_age: 3600
    preflight_continue: false
