  # WP-033 (DONE, 2026-08-30): the real CI-result-ingestion route landed on
  # backend/testPlanExecutionService (POST /api/v1/testexecution/ingest),
  # not defectService as originally sketched here -- see `executionIngestRoute`
  # below (grouped with `executionRoute`, the ExecutionService service block
  # at the top of this file) for the copy of this exact two-piece pattern,
  # and EXECUTION_LOG.md's WP-033 entry for the empirically-verified
  # route-precedence proof.
  - https_redirect_status_code: 426
    name: apiKeysDemoRoute
    path_handling: v0
    paths:
    - /api/v1/apikeys/demo
    preserve_host: false
    protocols:
    - http
    - https
    regex_priority: 0
    request_buffering: true
    response_buffering: true
    strip_path: false
    plugins:
    - name: jwt
      enabled: true
      config:
        claims_to_verify:
        - exp
        anonymous: apikeys-anonymous
  write_timeout: 60000
