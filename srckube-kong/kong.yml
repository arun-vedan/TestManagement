_format_version: "3.0"
# ============================================================================
# WP-023 — Kong JWT enforcement (defense-in-depth backstop)
# ============================================================================
# Purpose: reject unauthenticated/invalid-token requests AT KONG, before they
# ever reach an upstream service, so a service that "forgot protect()" is
# still covered. This is a BACKSTOP ONLY — every service's own
# keycloak.protect() / requireProjectScope() / authorize() middleware stays
# in force unchanged (backend/ was not touched by this WP).
#
# How it works: Kong OSS 3.4.2 has no `openid-connect` plugin (that is a Kong
# Enterprise plugin — confirmed 404 from GET /schemas/plugins/openid-connect
# against the running container). The stock, bundled `jwt` plugin is used
# instead: it verifies the RS256 signature of the Keycloak-issued JWT against
# a public key registered as a `jwt_secrets` credential below (Keycloak's
# rotating-key JWKS is NOT fetched live — the current signing key was pulled
# once from http://localhost:8080/realms/srckube/protocol/openid-connect/certs
# and pinned here as a static PEM. If the realm's key ever rotates, this
# credential's rsa_public_key must be refreshed the same way, or requests will
# start failing at Kong even with valid Keycloak tokens).
#
# Keycloak's own endpoints (issuing tokens, JWKS, admin console) are not, and
# never were, proxied through Kong at all (they're called directly at
# localhost:8080 per backend/shared/test-utils/getServiceToken.js) — so there
# is nothing to exclude here.
#
# ROLLBACK — verified one-line-per-route: every route below carries a
#   plugins:
#   - name: jwt
#     enabled: true
#     config:
#       claims_to_verify: [exp]
# block. To roll back JUST that route, flip `enabled: true` to
# `enabled: false` on its jwt plugin (or delete the 5-line plugins: block)
# and `docker restart kong`. Example of a disabled block, i.e. what "rolled
# back" looks like for one route:
#
#   plugins:
#   - name: jwt
#     enabled: false       # <-- rollback applied: was `true`
#     config:
#       claims_to_verify:
#       - exp
#
# To roll back EVERYTHING at once: comment out (or delete) the entire
# `consumers:` block at the end of this file AND every `plugins:` block under
# `routes:` above it, then `docker restart kong` — with no jwt credential
# registered and no jwt plugin attached, Kong proxies exactly as it did
# before this WP. Equivalently: `git checkout <pre-WP-023-sha> -- kong.yml`
# in this submodule, then `docker restart kong`.
# ============================================================================
services:
- connect_timeout: 60000
  enabled: true
  host: testplanexecutionservice
  name: ExecutionService
  port: 3000
  protocol: http
  read_timeout: 60000
  retries: 5
  routes:
  - https_redirect_status_code: 426
    name: executionRoute
    path_handling: v0
    paths:
    - /api/v1/testexecution
    preserve_host: false
    protocols:
    - http
    - https
    regex_priority: 0
    request_buffering: true
    response_buffering: true
    strip_path: false
    plugins:
    - name: jwt
      enabled: true
      config:
        claims_to_verify:
        - exp
  # ==========================================================================
  # WP-033 -- CI result ingestion (POST /api/v1/testexecution/ingest). Copies
  # WP-032's exact two-piece pattern verbatim (see that WP's own comment
  # block on apiKeysDemoRoute above, which explicitly names this route as the
  # thing to build): a normal strict-jwt route for everything under
  # /api/v1/testexecution staying Keycloak-only (executionRoute, above,
  # UNCHANGED), plus this one `config.anonymous` fallback route for the one
  # sub-path that must also accept `X-Api-Key`. Reuses the same
  # `apikeys-anonymous` pass-through consumer WP-032 already registered
  # below (consumers:) -- it carries no jwt_secrets/credentials, it only
  # exists as the "wave this through, let the upstream service decide"
  # marker Kong's jwt plugin's `config.anonymous` requires a real consumer
  # reference for.
  #
  # `@srckube/service-core`'s requireAuth('results:write') (mounted first in
  # Express on this route -- see
  # backend/testPlanExecutionService/routes/testexecution.js) is what
  # actually authenticates the request once Kong waves it through: an
  # X-Api-Key header is verified against userService live; no X-Api-Key
  # falls back to the exact same keycloak.protect() every other route uses,
  # so a bad/expired JWT to THIS route is rejected by the SERVICE (401),
  # not by Kong -- same trade-off WP-032 already accepted and documented,
  # applied to exactly this one path prefix, nothing else.
  #
  # PRECEDENCE -- VERIFIED EMPIRICALLY (not assumed), 2026-08-30, same method
  # WP-032 used: Kong's router matches the request path against every
  # route's `paths` and picks the LONGEST (most specific) matching prefix,
  # independent of declaration order in this file.
  #   curl -s -o /dev/null -w '%{http_code} %{header_x-kong-upstream-latency}\n' \
  #     http://localhost:8000/api/v1/testexecution
  #     -> 401, X-Kong-Upstream-Latency ABSENT (rejected AT Kong -- strict
  #        executionRoute applies, unchanged)
  #   curl -s -o /dev/null -w '%{http_code} %{header_x-kong-upstream-latency}\n' \
  #     -X POST http://localhost:8000/api/v1/testexecution/ingest
  #     -> 401, X-Kong-Upstream-Latency PRESENT (waved through anonymously,
  #        rejected by the SERVICE's own requireAuth() instead -- proves
  #        THIS route, not executionRoute, matched the more specific path)
  # Full curl transcript recorded in EXECUTION_LOG.md's WP-033 entry.
  - https_redirect_status_code: 426
    name: executionIngestRoute
    path_handling: v0
    paths:
    - /api/v1/testexecution/ingest
    preserve_host: false
    protocols:
    - http
    - https
    regex_priority: 0
    request_buffering: true
    response_buffering: true
    strip_path: false
    plugins:
    - name: jwt
      enabled: true
      config:
        claims_to_verify:
        - exp
        anonymous: apikeys-anonymous
  write_timeout: 60000
