# ============================================================================
# WP-061 -- /healthz routes, deliberately UNAUTHENTICATED (no jwt plugin
# attached, unlike every route above). An orchestrator/probe cannot present
# a Keycloak bearer token, so a health endpoint sitting behind WP-023's jwt
# plugin would be unprobeable through Kong -- these routes exist so
# `curl http://localhost:8000/healthz/<service>` works with NO
# Authorization header, while every other path on the same upstream stays
# exactly as protected as WP-023 left it (these are separate Kong
# `services`/`routes` entries, pointed at the same host:port -- the main
# API service objects above are UNTOUCHED).
#
# service-level `path: /healthz` + route-level `strip_path: true` means:
