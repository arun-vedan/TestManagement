      KeyCloak_clientId: node-microservice
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX}
      userService: userservice:3000
      PROJECT_SCOPE_CACHE_TTL_MS: ${PROJECT_SCOPE_CACHE_TTL_MS}
      requirementService: requirementservice:3000
      defectService: defectservice:3000
      testPlanExecutionService: testplanexecutionservice:3000
      linkIssueService: linkissueservice:3000
      releaseService: releaseservice:3000
      istatusService: istatusservice:3000
      testRepoService: testreposervice:3000
      REPORT_REFRESH_CRON: ${REPORT_REFRESH_CRON:-*/5 * * * *}
      REPORT_STALE_MS: ${REPORT_STALE_MS:-300000}
    networks:
    - src-kube-network
    image: ghcr.io/arun-vedan/testmanagement/reportingservice:${IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: 256m
  aiservice:
    container_name: aiservice
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:3000/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
    - mongodb
    - redis
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/srckube-ai?authSource=admin
      KeyCloak_URI: ${KEYCLOAK_PUBLIC_URL}
      KeyCloak_Admin_URI: http://keycloak:8080
      KeyCloak_Realm: srckube
      KeyCloak_Secret: ${KEYCLOAK_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      KeyCloak_publicKey: ${KEYCLOAK_REALM_PUBLIC_KEY}
      KeyCloak_clientId: node-microservice
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX}
      userService: userservice:3000
      PROJECT_SCOPE_CACHE_TTL_MS: ${PROJECT_SCOPE_CACHE_TTL_MS}
      requirementService: requirementservice:3000
      testRepoService: testreposervice:3000
      reportingService: reportingservice:3000
      REDIS_URI: ${REDIS_URI}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_USER_AGENT: ${AI_USER_AGENT:-srckube-aiService/1.0}
      AI_SESSION_HEADER: ${AI_SESSION_HEADER:-}
      AI_GLOBALLY_ENABLED: ${AI_GLOBALLY_ENABLED:-false}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-15000}
      AI_DAILY_RATE_LIMIT: ${AI_DAILY_RATE_LIMIT:-50}
      AI_LOG_RETENTION_DAYS: ${AI_LOG_RETENTION_DAYS:-30}
      AI_STORE_FULL_TEXT: ${AI_STORE_FULL_TEXT:-false}
      AI_LOG_PREVIEW_CHARS: ${AI_LOG_PREVIEW_CHARS:-200}
    networks:
    - src-kube-network
    image: ghcr.io/arun-vedan/testmanagement/aiservice:${IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: 256m
  postgres:
    image: postgres:18
    container_name: postgres
    volumes:
    - keycloack-themes-postgres-pg18:/var/lib/postgresql
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
    - src-kube-network
    restart: unless-stopped
    mem_limit: 384m
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: keycloak
    command: start-dev --spi-theme-static-max-age=-1 --spi-theme-cache-themes=false --spi-theme-cache-templates=false
      --verbose
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_DB_SCHEMA: public
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      JAVA_OPTS_APPEND: -Xms256m -Xmx768m
    volumes:
    - ./themes/kdk:/opt/keycloak/themes/kdk
    - ./themes/kapp:/opt/keycloak/themes/kapp
    networks:
    - src-kube-network
    depends_on:
    - postgres
    restart: unless-stopped
    mem_limit: 1024m
  kong:
    image: kong:3.4
    container_name: kong
    environment:
      KONG_DATABASE: 'off'
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PLUGINS: bundled
      KONG_PORTAL: 'on'
      KONG_ADMIN_GUI_LISTEN: 'off'
      KONG_DNS_VALID_TTL: '10'
      KONG_DNS_STALE_TTL: '2'
      KONG_DNS_NOT_FOUND_TTL: '5'
      KONG_DNS_ERROR_TTL: '1'
    networks:
    - src-kube-network
    volumes:
    - ./kong.yml:/kong/declarative/kong.yml
    restart: unless-stopped
    mem_limit: 768m
volumes:
  keycloack-themes-postgres: null
  mongo-srckube-data:
    driver: local
  redis-data:
    driver: local
  keycloack-themes-postgres-pg18: null
networks:
  src-kube-network:
    external: true
