# Build every image and publish it to GHCR, then deploy.
#
# BUILDS HERE, NOT ON THE SERVER. The VPS has 2 vCPU and no source tree.
# Building 18 Node images plus a CRA bundle there takes tens of minutes and
# can OOM mid-deploy, which would take the running site down with it. Actions
# builds in parallel on throwaway runners; the VPS only pulls and restarts.
#
# GHCR needs no extra account or credential: packages:write on the built-in
# GITHUB_TOKEN is enough, and images inherit the repository's visibility.

name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy after building"
        type: boolean
        default: true

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # never interrupt a deploy mid-flight

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  backend:
    name: build ${{ matrix.svc.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false    # one bad service should not hide the other 17
      matrix:
        svc:
          - { name: aiservice, dockerfile: aiService/dockerfile }
          - { name: automationservice, dockerfile: automationService/dockerfile }
          - { name: commentsservice, dockerfile: commentsService/dockerfile }
          - { name: defectservice, dockerfile: defectService/dockerfile }
          - { name: fieldsservice, dockerfile: fieldsService/dockerfile }
          - { name: folderservice, dockerfile: folderService/dockerfile }
          - { name: istatusservice, dockerfile: statusService/dockerfile }
          - { name: linkissueservice, dockerfile: linkIssueService/dockerfile }
          - { name: moduleservice, dockerfile: moduleService/dockerfile }
          - { name: notificationservice, dockerfile: notificationService/dockerfile }
          - { name: objectrepo, dockerfile: objectRepo/dockerfile }
          - { name: releaseservice, dockerfile: releaseService/dockerfile }
          - { name: reportingservice, dockerfile: reportingService/dockerfile }
          - { name: requirementservice, dockerfile: requirementService/dockerfile }
          - { name: testplanexecutionservice, dockerfile: testPlanExecutionService/dockerfile }
          - { name: testreposervice, dockerfile: testRepoService/dockerfile }
          - { name: uploadservice, dockerfile: uploadService/dockerfile }
          - { name: userservice, dockerfile: userService/dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          # backend/ is the context, not the service directory: every
          # dockerfile reaches up into shared/service-core, which is outside
          # its own folder.
          context: backend
          file: backend/${{ matrix.svc.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/testmanagement/${{ matrix.svc.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/testmanagement/${{ matrix.svc.name }}:latest
          # Layer cache in the registry, so a one-line change does not
          # reinstall node_modules for all 18 services.
          cache-from: type=gha,scope=${{ matrix.svc.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.svc.name }}

  frontend:
    name: build frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          # CRA inlines these into the bundle AT BUILD TIME. They cannot be
          # changed later by setting a container variable, which is why the
          # image is environment-specific and these are build args.
          build-args: |
            REACT_APP_API_BASE_URL=https://${{ vars.API_HOST || 'api.vedan.io' }}
            REACT_APP_KEYCLOAK_BASE_URL=https://${{ vars.AUTH_HOST || 'auth.vedan.io' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/testmanagement/frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/testmanagement/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: deploy to VPS
    needs: [backend, frontend]
    if: github.event_name == 'push' || inputs.deploy
    runs-on: ubuntu-latest
    # Without this the job gets the repository's DEFAULT token permissions,
    # which carry no `packages` scope -- so `docker login ghcr.io` with
    # GITHUB_TOKEN fails in about three seconds and, under `script_stop: true`,
    # takes the whole deploy with it. Both deploys before this one died exactly
    # there: the images were built and pushed fine (the build jobs below do
    # declare packages: write), and nothing was ever pulled. The stack on the
    # VPS was healthy only because it had been assembled by hand.
    #
    # `read`, not `write`: this job only pulls.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # The compose files are not enough on their own. Three services bind-mount
      # paths RELATIVE to the compose file, and Docker silently creates an
      # empty DIRECTORY where a missing file is mounted — which is how Kong
      # ended up in a crash loop with "kong.yml: Is a directory", and how
      # Keycloak came up serving the stock theme instead of kdk.
      #
      # Built as one tarball rather than several scp globs because the sources
      # live at different depths (srckube-kong/, keycloak-themes/themes/) and
      # have to land in a flat layout next to the compose files.
      - name: stage the deployment bundle
        run: |
          set -euo pipefail
          mkdir -p bundle/themes bundle/realm
          cp deploy/docker-compose.prod.yml deploy/docker-compose.edge.yml bundle/
          cp srckube-kong/kong.yml bundle/kong.yml
          cp deploy/render-kong-jwt.py bundle/
          cp -r keycloak-themes/themes/kdk bundle/themes/
          cp keycloak-themes/realm/srckube-realm.json bundle/realm/
          tar -czf bundle.tgz -C bundle .
          # NOT `tar -tzf ... | head`: under `set -o pipefail`, head closing
          # the pipe early makes tar die of SIGPIPE and the whole step fails
          # with no useful message. Count first, then print a bounded list
          # from a variable.
          entries=$(tar -tzf bundle.tgz | wc -l)
          echo "bundle: $entries entries"
          listing=$(tar -tzf bundle.tgz)
          echo "$listing" | sed -n '1,12p'

      - name: copy the bundle to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: bundle.tgz
          target: /opt/vedan

      - name: unpack
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/vedan
            # Docker creates an empty directory wherever a bind-mount source
            # is missing, and creates it as ROOT even though /opt/vedan belongs
            # to deploy. tar then cannot write into those directories and the
            # whole extract fails halfway — which is exactly what happened:
            # kong.yml landed, themes/ did not.
            #
            # Removing them works because deleting an entry needs write
            # permission on the PARENT (deploy owns /opt/vedan), not on the
            # directory itself. Done before every extract so a stale mount
            # directory can never shadow real content.
            # Fingerprint the bind-mounted content so the step below knows
            # whether Keycloak has to be restarted. Cheap, and it keeps a
            # routine deploy from bouncing the identity provider for nothing.
            fp() { find themes realm -type f -exec sha256sum {} + 2>/dev/null \
                   | sort | sha256sum | cut -d' ' -f1; }
            before=$(fp)
            rm -rf kong.yml themes realm render-kong-jwt.py
            tar -xzf bundle.tgz
            rm -f bundle.tgz
            if [ "$before" != "$(fp)" ]; then
              : > .themes-changed.tmp && mv -f .themes-changed.tmp .themes-changed
              echo "themes/realm changed"
            else
              rm -f .themes-changed
              echo "themes/realm unchanged"
            fi
            # No `| head` here. Under pipefail that is a SIGPIPE waiting to
            # fail the step, which is what broke the staging step one commit
            # ago.
            echo "unpacked:"
            ls -la /opt/vedan

      - name: pull and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/vedan
            # .env lives ONLY on the server and is never in the repo or in
            # this workflow: it holds the Keycloak secret, Mongo passwords
            # and the credential keys.
            # Keep a copy of this step's output ON THE SERVER. Reading an
            # Actions log needs a token this project does not have to hand,
            # and three deploys were debugged by inference because of it.
            # Bounded: a deploy log nobody prunes becomes the reason a disk
            # fills, and this box has already lost Kong and MongoDB to a full
            # Docker VM once.
            if [ -f deploy.log ] && [ "$(stat -c %s deploy.log)" -gt 2000000 ]; then
              tail -c 500000 deploy.log > deploy.log.tmp && mv -f deploy.log.tmp deploy.log
            fi
            # A PLAIN redirect, with the tail echoed back on exit. The first
            # attempt used `exec > >(tee -a deploy.log)`, and process
            # substitution cost a deploy: the shell does not wait for the
            # background tee, so the log was truncated mid-step AND the step
            # died before restarting Kong -- which left Kong serving a stale
            # config while every file on disk looked correct.
            exec 3>&1
            exec >> deploy.log 2>&1
            # Traced into the log (not the Actions output): this step has
            # failed for three different reasons now, and a trace names the
            # line instead of leaving it to be inferred.
            set -x
            trap 'rc=$?; { tail -80 /opt/vedan/deploy.log >&3; } || true; exit $rc' EXIT
            echo "=== $(date -u +%FT%TZ) deploy ${{ github.sha }} ==="

            test -f .env || { echo "/opt/vedan/.env is missing"; exit 1; }
            echo "IMAGE_TAG=${{ github.sha }}" > .env.tag

            # Holds the realm public key, which only exists once Keycloak has
            # booted (see the repoint step below). It must exist before the
            # --env-file reference below.
            #
            # NOT `touch`: touch on an existing file needs write permission on
            # the FILE, and a file left in /opt/vedan by root makes it fail
            # with "Permission denied" -- which is exactly what killed the two
            # deploys after this file was first created by hand as root. Going
            # through a rename needs write permission on the DIRECTORY, which
            # the deploy user has, so it works whoever owns the old file.
            # Same failure mode as the stale root-owned bind-mount dirs that
            # broke the unpack step earlier in this project's history.
            if [ ! -f .env.runtime ]; then
              : > .env.runtime.tmp && mv -f .env.runtime.tmp .env.runtime
            fi
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            docker compose --env-file .env --env-file .env.tag --env-file .env.runtime \
              -f docker-compose.prod.yml -f docker-compose.edge.yml pull --quiet
            docker compose --env-file .env --env-file .env.tag --env-file .env.runtime \
              -f docker-compose.prod.yml -f docker-compose.edge.yml up -d --remove-orphans
            # Images accumulate fast with 19 of them per deploy; the VPS has
            # 96 GB but an unpruned host fills quietly and then nothing starts.
            docker image prune -f --filter "until=168h"
            docker compose -f docker-compose.prod.yml -f docker-compose.edge.yml ps

      # WHY THIS STEP EXISTS, and why it cannot be a committed value.
      #
      # Kong validates every API token itself, in DB-less mode, against one
      # credential in kong.yml. That credential has to match the realm that is
      # actually running, in TWO ways, and the committed file cannot satisfy
      # either:
      #
      #   the lookup key — Kong's jwt plugin finds the credential BY the
      #   token's `iss` claim. Committed value is http://localhost:8080/...,
      #   production issues https://${AUTH_HOST}/..., so nothing matches.
      #
      #   the public key — sanitise-realm-export.py deliberately strips the
      #   realm's *KeyProvider components, because a realm's signing material
      #   must never be committed to a public repository. Keycloak therefore
      #   mints new keys when it first imports the realm. The correct value
      #   does not exist until that has happened, so it can only be discovered
      #   here.
      #
      # Measured before this existed: signup and login both succeeded, the app
      # shell rendered at /projects/1/dashboard, and every API call behind it
      # returned 401. The stack looked up and was unusable.
      - name: supply the running realm's public key to Kong and the services
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/vedan
            exec 3>&1
            exec >> deploy.log 2>&1
            # Traced into the log (not the Actions output): this step has
            # failed for three different reasons now, and a trace names the
            # line instead of leaving it to be inferred.
            set -x
            trap 'rc=$?; { tail -80 /opt/vedan/deploy.log >&3; } || true; exit $rc' EXIT
            echo "=== $(date -u +%FT%TZ) repoint ${{ github.sha }} ==="

            # Bind mounts resolve to an INODE at container start, and the
            # unpack step replaces themes/ and realm/ wholesale -- so a
            # container that compose did not recreate stays mounted on the
            # directory that was deleted. Kong escapes it only because it is
            # restarted below; Keycloak is never recreated (its configuration
            # does not change between deploys), so it kept serving a theme
            # directory that no longer existed, fell back to parent=base, and
            # rendered a login page with no form on it at all. The page was
            # 200 and every file on disk was correct.
            if [ -f .themes-changed ]; then
              echo "theme or realm files changed; restarting keycloak to re-resolve its mounts"
              docker restart keycloak
              rm -f .themes-changed
            fi
            # NOT `grep ... | cut`: a grep that matches nothing exits 1,
            # and under `set -o pipefail` that aborts the whole step with no
            # message at all -- which is indistinguishable from the step
            # dying somewhere else entirely. `sed -n ...p` exits 0 whether or
            # not it matched, so the failure can be stated instead of guessed.
            AUTH_HOST=$(sed -n 's/^AUTH_HOST=//p' .env | head -1 | tr -d '\r')
            test -n "$AUTH_HOST" || { echo "AUTH_HOST is missing from /opt/vedan/.env"; exit 1; }
            ISSUER="https://${AUTH_HOST}/realms/srckube"

            # Keycloak is started, not necessarily ready: it imports the realm
            # and builds its key set on first boot, and the key we need does
            # not exist until that finishes.
            for i in $(seq 1 40); do
              curl -fsS --max-time 5 "$ISSUER" >/dev/null 2>&1 && break
              [ "$i" = 40 ] && { echo "$ISSUER never became ready"; exit 1; }
              sleep 3
            done

            # The SAME stale key appears in two places, and both reject
            # tokens. Kong validates with it at the edge; each of the 18
            # services validates with it again, offline, through
            # keycloak-connect's realm-public-key. Fixing only Kong turns
            # 401 into 403 and the app is still unusable — measured.
            KEY=$(curl -fsS --max-time 10 "$ISSUER" \
                  | python3 -c 'import json,sys; print(json.load(sys.stdin)["public_key"])')
            test -n "$KEY" || { echo "realm returned no public_key"; exit 1; }

            env_before=$(sha256sum .env.runtime 2>/dev/null | cut -d' ' -f1 || echo none)
            # Through a rename, so ownership of the previous file is irrelevant.
            printf 'KEYCLOAK_REALM_PUBLIC_KEY=%s\n' "$KEY" > .env.runtime.tmp
            mv -f .env.runtime.tmp .env.runtime
            env_after=$(sha256sum .env.runtime | cut -d' ' -f1)

            kong_before=$(sha256sum kong.yml | cut -d' ' -f1)
            python3 render-kong-jwt.py kong.yml "$ISSUER"
            kong_after=$(sha256sum kong.yml | cut -d' ' -f1)

            # Re-apply so the services pick up the key. Compose recreates only
            # containers whose configuration actually changed, so in steady
            # state (same realm, same key) this is a no-op.
            if [ "$env_before" != "$env_after" ]; then
              echo "realm public key changed; re-applying so services pick it up"
              docker compose --env-file .env --env-file .env.tag --env-file .env.runtime \
                -f docker-compose.prod.yml -f docker-compose.edge.yml up -d --remove-orphans
            else
              echo "realm public key unchanged"
            fi

            # Kong reads kong.yml once at boot. Restart only on a real change,
            # so a routine deploy does not drop the API for no reason.
            if [ "$kong_before" != "$kong_after" ]; then
              docker restart kong
              for i in $(seq 1 30); do
                [ "$(docker inspect -f '{{.State.Health.Status}}' kong 2>/dev/null)" = healthy ] && break
                sleep 2
              done
              docker inspect -f 'kong: {{.State.Health.Status}}' kong
            else
              echo "kong.yml unchanged; no restart needed"
            fi
